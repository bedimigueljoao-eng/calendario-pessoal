name: Compilar APK Android StudyTrack

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Gerar APK Nativo Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Obter codigo-fonte
        uses: actions/checkout@v4

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Confirmar versoes do ambiente
        run: |
          node --version
          java -version

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Confirmar versao do Bun
        run: bun --version

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Compilar aplicacao para Android
        run: bun run build -- --mode android

      - name: Validar compilacao Android
        run: |
          test -d dist
          test -f dist/index.html
          grep -q 'src="./assets/' dist/index.html
          grep -q 'href="./assets/' dist/index.html
          if grep -q '/calendario-pessoal/assets/' dist/index.html; then
            echo "Erro: o build Android ainda contem caminhos do GitHub Pages."
            exit 1
          fi
          echo "Build Android validado com caminhos relativos."
          ls -la dist

      - name: Sincronizar Capacitor com Android
        run: bunx cap sync android

      - name: Validar integracao do Capacitor Android
        run: |
          test -d node_modules/@capacitor/android/capacitor
          test -f android/settings.gradle
          test -f android/capacitor.settings.gradle
          grep -q "capacitor-android" android/capacitor.settings.gradle
          grep -q "capacitor.settings.gradle" android/settings.gradle
          grep -q "capacitor-android" android/app/build.gradle
          echo "Integracao do Capacitor Android validada."

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Regenerar Gradle Wrapper
        working-directory: android
        run: |
          rm -f gradle/wrapper/gradle-wrapper.jar
          gradle wrapper --gradle-version 8.14.3
          chmod +x gradlew

      - name: Validar Gradle Wrapper
        run: |
          test -f android/gradlew
          test -f android/gradlew.bat
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/gradle/wrapper/gradle-wrapper.jar
          jar tf android/gradle/wrapper/gradle-wrapper.jar | grep "org/gradle/wrapper/GradleWrapperMain.class"
          cd android
          ./gradlew --version

      - name: Validar AndroidManifest
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('android/app/src/main/AndroidManifest.xml'); print('AndroidManifest.xml valido')"

      - name: Limpar compilacao Android
        working-directory: android
        run: ./gradlew clean --stacktrace

      - name: Compilar APK Debug
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verificar APK gerado
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Carregar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: StudyTrack-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
